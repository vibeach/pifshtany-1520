<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пифагоровы штаны — презентация</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0A1428; color: white; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; height: 100vh; }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 40px 90px;
  }
  .slide-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    background: white;
  }
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.5), transparent);
    z-index: 10;
    font-size: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    text-decoration: none;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 18px;
  }
  .brand-mark { font-size: 22px; }
  .topbar-right { display: flex; gap: 16px; align-items: center; color: rgba(255,255,255,0.7); }
  .back-link { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; }
  .back-link:hover { color: white; }
  .counter {
    padding: 4px 12px;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .footbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 24px;
    display: flex;
    justify-content: center;
    gap: 12px;
    align-items: center;
    background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
    z-index: 10;
  }
  .nav-btn {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.18);
    color: white;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.15s ease;
    backdrop-filter: blur(6px);
  }
  .nav-btn:hover { background: rgba(255,255,255,0.22); }
  .nav-btn[disabled] { opacity: 0.35; cursor: not-allowed; }
  .thumbs {
    position: fixed;
    left: 24px;
    top: 60px;
    bottom: 90px;
    width: 130px;
    overflow-y: auto;
    padding: 6px 6px;
    z-index: 5;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.2) transparent;
  }
  .thumb {
    display: block;
    width: 100%;
    margin-bottom: 8px;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
    background: white;
    aspect-ratio: 1.414 / 1;
    object-fit: contain;
    transition: border-color 0.15s ease;
    opacity: 0.55;
  }
  .thumb:hover { opacity: 0.85; }
  .thumb.active { border-color: #F9E1A5; opacity: 1; }
  .stage-inner { position: relative; max-width: 90vw; max-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .slide-caption {
    position: absolute;
    bottom: -60px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 20px;
    color: rgba(255,255,255,0.85);
    pointer-events: none;
  }
  @media (max-width: 900px) {
    .thumbs { display: none; }
    .stage { padding: 60px 12px 90px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="./index.html">
    <span class="brand-mark">π</span> Пифагоровы штаны
  </a>
  <div class="topbar-right">
    <span class="counter"><span id="cur">1</span> / <span id="total">10</span></span>
    <a class="back-link" href="./index.html">← Веб-версия</a>
  </div>
</div>

<div class="thumbs" id="thumbs"></div>

<div class="stage">
  <div class="stage-inner">
    <img id="slide" class="slide-img" src="./slides/final_p01.jpg" alt="Slide 1">
    <div class="slide-caption" id="caption"></div>
  </div>
</div>

<div class="footbar">
  <button class="nav-btn" id="prev">← Назад</button>
  <button class="nav-btn" id="next">Далее →</button>
</div>

<script>
  const captions = [
    "Пифагоровы штаны",
    "Кто стоит за системой?",
    "Что получает школа?",
    "Результаты для учеников и школы",
    "Как происходит запуск",
    "Стоимость",
    "Пример экономики",
    "Альтернативная модель",
    "Сочетание с программой",
    "Контакты"
  ];
  const total = 10;
  let cur = 1;

  const img = document.getElementById('slide');
  const counter = document.getElementById('cur');
  const totalEl = document.getElementById('total');
  const caption = document.getElementById('caption');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const thumbs = document.getElementById('thumbs');
  totalEl.textContent = total;

  // build thumbs
  for (let i=1; i<=total; i++) {
    const t = document.createElement('img');
    t.className = 'thumb';
    t.src = `./slides/final_p${String(i).padStart(2,'0')}.jpg`;
    t.dataset.n = i;
    t.addEventListener('click', () => go(i));
    thumbs.appendChild(t);
  }

  function render() {
    const p = String(cur).padStart(2, '0');
    img.src = `./slides/final_p${p}.jpg`;
    counter.textContent = cur;
    caption.textContent = captions[cur - 1] || '';
    prev.disabled = (cur === 1);
    next.disabled = (cur === total);
    Array.from(thumbs.children).forEach((el, idx) => {
      el.classList.toggle('active', (idx + 1) === cur);
    });
    // scroll active thumb into view
    const active = thumbs.querySelector('.thumb.active');
    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    // preserve URL state
    history.replaceState(null, '', `#${cur}`);
  }
  function go(n) { if (n>=1 && n<=total) { cur = n; render(); } }
  prev.addEventListener('click', () => go(cur - 1));
  next.addEventListener('click', () => go(cur + 1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    if (e.key === 'Home') go(1);
    if (e.key === 'End') go(total);
    if (/^[1-9]$/.test(e.key)) go(parseInt(e.key, 10));
    if (e.key === '0') go(10);
  });
  // load from hash
  const hashN = parseInt((location.hash || '#1').slice(1), 10);
  if (!isNaN(hashN) && hashN >= 1 && hashN <= total) cur = hashN;
  render();
</script>

</body>
</html>
